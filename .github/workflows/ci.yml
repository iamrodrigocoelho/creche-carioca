# Gates de CI exigidos por PRD 14.8.
#
# PRD 13.7: actions fixadas por versao confiavel, lockfile versionado,
# build reprodutivel em ambiente limpo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PRD 14.3: "API com PostgreSQL real em container de teste".
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: match
          POSTGRES_PASSWORD: match_ci
          POSTGRES_DB: match_perfeito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U match"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credenciais efêmeras do runner, sem valor fora deste job (PRD 13.4).
      DATABASE_URL: postgresql://match:match_ci@localhost:5432/match_perfeito?schema=public
      DATABASE_URL_TEST: postgresql://match:match_ci@localhost:5432/match_perfeito_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` garante que o lockfile versionado e respeitado.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      # Precede as etapas de banco: `build` gera o cliente Prisma e compila o
      # seed, que as duas etapas seguintes executam.
      - name: Build
        run: pnpm build

      # O banco de teste precisa existir antes da suíte: ela trunca tabelas e por
      # isso nunca compartilha o banco de desenvolvimento.
      - name: Criar banco de teste
        run: PGPASSWORD=match_ci psql -h localhost -U match -d match_perfeito -c 'CREATE DATABASE match_perfeito_test;'

      - name: Aplicar migrations
        run: pnpm db:deploy

      - name: Semear dados de demonstração
        run: pnpm db:seed

      - name: Verificação de tipos
        run: pnpm typecheck

      # TEMPORÁRIO: diagnóstico de "No test files found" no runner Linux.
      - name: Diagnóstico da coleta de testes
        run: |
          echo "--- arquivos .test.ts em apps/api/src ---"
          find apps/api/src -name '*.test.ts' -print
          echo "--- vitest --list ---"
          cd apps/api && pnpm exec vitest list 2>&1 | head -30 || true

      - name: Testes unitários e de integração
        run: pnpm test:coverage

      - name: Instalar navegador do Playwright
        run: pnpm --filter @match/web exec playwright install --with-deps chromium

      - name: Smoke E2E
        run: pnpm e2e

  security:
    name: Análise de dependências e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo é necessário para a varredura de segredos.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # PRD 13.7: bloquear merge com vulnerabilidade crítica conhecida.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level critical

      # TODO (Fase 14): adicionar SAST e geração de SBOM em builds de release,
      # conforme PRD 13.7.
      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
