packages:
  - 'apps/*'
  - 'packages/*'

# PRD 13.7 (supply chain): scripts de instalacao rodam apenas para dependencias
# explicitamente aprovadas aqui. Cada entrada e uma decisao consciente e auditavel.
# @swc/core: usado apenas em tempo de teste, para emitir os metadados de decorator
# que o NestJS exige e o esbuild do Vitest nao produz.
# @prisma/engines e prisma: baixam os engines nativos do PostgreSQL na instalacao.
# esbuild: dependencia transitiva do SDK `railway`, usado apenas pela CLI ao ler
# .railway/railway.ts. Negado explicitamente - nada no repositorio executa esbuild.
allowBuilds:
  esbuild: false
  '@prisma/engines': true
  '@swc/core': true
  prisma: true

# Versoes recentes liberadas explicitamente da politica de idade minima de release.
minimumReleaseAgeExclude:
  - zod@4.5.4
